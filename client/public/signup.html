<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Create your eMenu account | ZenVentora</title>
  <meta name="description" content="Create your ZenVentora account to get started with eMenu.">
  <script>
    (function () {
      var target = new URL("https://accounts.zenventora.in/");
      target.searchParams.set("view", "signup");
      target.searchParams.set("product", "emenu");
      target.searchParams.set("productFlow", "signup");
      target.searchParams.set("returnTo", "https://emenu.zenventora.in");
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <main>
    <h1>Create your eMenu account</h1>
    <p>Redirecting you to secure ZenVentora account signup…</p>
    <p><a href="https://accounts.zenventora.in/?view=signup&amp;product=emenu&amp;productFlow=signup&amp;returnTo=https%3A%2F%2Femenu.zenventora.in">Continue to signup</a></p>
  </main>
</body>
</html>
